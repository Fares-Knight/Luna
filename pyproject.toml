[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "luna"
version = "0.1.0"
description = "Coupe Fleur : jeu de stratégie local pour deux joueurs, en Python et Pygame."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt", "src/luna/assets/fonts/*-OFL.txt"]
requires-python = ">=3.13"
dependencies = ["pygame==2.6.1"]

[project.urls]
Repository = "https://github.com/Fares-Knight/Luna"
Documentation = "https://github.com/Fares-Knight/Luna/blob/main/README.md"
Issues = "https://github.com/Fares-Knight/Luna/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.9", "pip-audit>=2.7"]
web = ["pygbag==0.9.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["luna*"]
namespaces = false

[tool.setuptools.package-data]
luna = ["assets/images/*", "assets/fonts/*", "assets/sounds/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
